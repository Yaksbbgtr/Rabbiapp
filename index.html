<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="description" content="The all-in-one classroom app for yeshiva ketana rebbeim.">
  <title>Rebbi App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Rebbi App">
  <script>
    // Apply the chosen appearance before the page draws (light / dark / follow the phone).
    try { var t = localStorage.getItem('rabbiapp.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="icons/logo-white.png" alt="Yeshiva K'tana of Waterbury" width="906" height="454">
        <div class="brand-sub"><span class="brand-name">Rebbi App</span><span class="brand-class" id="brand-class"></span></div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="theme-switch"><div class="label">Appearance</div><div class="theme-seg" id="theme-seg" role="group" aria-label="Appearance"></div></div>
    </aside>
    <div class="content">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-title" id="topbar-title"></div>
        <div id="header-date" class="header-date"></div>
        <button type="button" class="profile-btn" id="profile-btn" aria-label="Profile"></button>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="nav-backdrop" id="nav-backdrop"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Rebbi App needs JavaScript turned on.</noscript>

  <script src="js/hebcal.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/store.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/views/profiles.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/scan.js"></script>
  <script src="js/views/talmidim.js"></script>
  <script src="js/views/attendance.js"></script>
  <script src="js/views/limud.js"></script>
  <script src="js/views/bechinos.js"></script>
  <script src="js/views/planner.js"></script>
  <script src="js/views/parents.js"></script>
  <script src="js/views/tools.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/myissues.js"></script>
  <script src="js/sendreports.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/admin.js"></script>
</body>
</html>
