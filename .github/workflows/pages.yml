name: Publish Rebbi App to GitHub Pages

on:
  push:
    branches: [main, claude/funny-bell-fi96fo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: |
          node tests/hebcal.test.js
          node tests/scan.test.js
          node tests/templates.test.js

      - name: Build site (static app only, no server code)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll
          # New cache name each deploy so installed apps pick up updates
          sed -i "s/var CACHE = 'rebbi-app-v1';/var CACHE = 'rebbi-app-${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "rebbi-app-${GITHUB_SHA::8}" _site/sw.js
          # Stamp the version into the app and publish it, so open apps can tell they're out of date
          BUILT="$(TZ=America/New_York date '+%b %-d, %-I:%M %p')"
          sed -i "s/var APP_VERSION = 'dev';/var APP_VERSION = '${GITHUB_SHA::8}';/; s/var APP_BUILT = '';/var APP_BUILT = '${BUILT}';/" _site/js/app.js
          grep -q "APP_VERSION = '${GITHUB_SHA::8}'" _site/js/app.js
          echo "{\"version\": \"${GITHUB_SHA::8}\", \"built\": \"${BUILT}\"}" > _site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
